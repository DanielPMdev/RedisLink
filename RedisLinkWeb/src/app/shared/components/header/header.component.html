<header class="bg-black bg-opacity-30 backdrop-blur-md border-b border-white border-opacity-10">
  <div class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
        </svg>
        <h1 class="text-2xl font-bold text-white">RedisLink</h1>
      </a>
      
      <nav class="flex items-center gap-6">
        <a 
          routerLink="/" 
          routerLinkActive="text-pink-400"
          [routerLinkActiveOptions]="{exact: true}"
          class="text-gray-300 hover:text-white transition-colors font-medium"
        >
          Inicio
        </a>
        <a 
          routerLink="/stats" 
          routerLinkActive="text-pink-400"
          class="text-gray-300 hover:text-white transition-colors font-medium"
        >
          Estadísticas
        </a>
      </nav>
    </div>
  </div>
</header>
